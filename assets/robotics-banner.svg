<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Sense. Plan. Move.</title>
  <desc id="desc">A robotics blueprint with sensor rings, an autonomous navigation path, and a mobile robot on a dark navy grid.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#122636"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#294454" stroke-width="0.6"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="260" rx="18"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
