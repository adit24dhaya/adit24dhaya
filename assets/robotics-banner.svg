    <rect width="1200" height="260" fill="url(#grid)" opacity="0.45"/>
    <rect width="6" height="260" fill="url(#accent)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
