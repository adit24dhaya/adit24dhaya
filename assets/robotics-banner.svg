      <text x="48" y="133" fill="#f0f6fc" font-size="62" font-weight="700" letter-spacing="-2">Sense. Plan. Move.</text>
      <text x="52" y="177" fill="#b7cbd9" font-size="21">From sensor data to reliable robot behavior.</text>
      <g font-size="12" font-weight="600" letter-spacing="1.5" fill="#94b2c6">
